<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 - Page Not Found | WorkNest Premium Co-Working Spaces">
  <title>404 - Space Not Found | WorkNest</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/index.css">

  <style>
    body {
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .error-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .error-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-2xl);
      padding: 56px 40px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 50px rgba(16, 185, 129, 0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      position: relative;
      overflow: hidden;
    }

    .error-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .error-brand-logo {
      display: inline-block;
      margin-bottom: 24px;
      transition: transform var(--transition-fast);
    }

    .error-brand-logo:hover {
      transform: scale(1.05);
    }

    .error-brand-logo img {
      height: 44px;
      width: auto;
      object-fit: contain;
      filter: brightness(0) invert(1) drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
    }

    .error-glitch-number {
      font-family: var(--font-heading);
      font-size: clamp(5.5rem, 15vw, 10rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.05em;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 20%, var(--primary-light) 60%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
      position: relative;
      display: inline-block;
      animation: floatNumber 4s ease-in-out infinite alternate;
    }

    @keyframes floatNumber {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-10px) rotate(-1deg); }
    }

    .error-title {
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .error-desc {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--text-secondary);
      max-width: 520px;
      margin: 0 auto 36px auto;
    }

    .error-actions-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .error-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fb7185;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: var(--radius-pill);
      margin-bottom: 20px;
    }

    .error-meta-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f43f5e;
      box-shadow: 0 0 8px #f43f5e;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow & Particles -->
  <div class="ambient-glow-wrapper" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
  </div>
  <canvas id="particleCanvas" aria-hidden="true"></canvas>

  <div class="custom-cursor" aria-hidden="true"></div>
  <div class="custom-cursor-follower" aria-hidden="true"></div>

  <!-- ==================== 404 HERO SECTION (NO HEADER / NO FOOTER) ==================== -->
  <section class="error-hero">
    <div class="error-card glass-card" data-animate="zoom-in">
      
      <!-- Brand Logo -->
      <a href="index.html" class="error-brand-logo" aria-label="WorkNest Home">
        <img src="images/stackly-logo.webp" alt="WorkNest Logo">
      </a>

      <div>
        <span class="error-meta-pill">
          <span class="dot"></span> Error 404 &bull; Resource Unavailable
        </span>
      </div>

      <div class="error-glitch-number">404</div>

      <h1 class="error-title">Oops! Space Not Found</h1>
      <p class="error-desc">
        The workspace, suite, or portal page you are attempting to reach has either been relocated, temporarily reassigned, or is currently reserved. Let's get you back on track.
      </p>

      <!-- Back Button & Return to Home Button -->
      <div class="error-actions-group">
        <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='index.html'" class="btn-magnetic btn-secondary-glass btn-lg-custom" aria-label="Go Back to Previous Page">
          <i class="bi bi-arrow-left me-2"></i> Back
        </button>
        <a href="index.html" class="btn-magnetic btn-primary-glow btn-lg-custom btn-shimmer" aria-label="Return to Homepage">
          <i class="bi bi-house-door-fill me-2"></i> Return to Home
        </a>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
